# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=SUPER,Return,spawn,ghostty
bind=SUPER,d,spawn,fuzzel 
bind=SUPER+SHIFT,d,spawn_shell,bemoji -c # this is an emoji picker

#clipboard
bind=SUPER,period,spawn_shell,cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy


# bind=ALT,m,quit
bind=SUPER,q,killclient,

#screen shot  thats print key btw
bind=SUPER,print,spawn_shell,grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -t ppm - | satty -f -
#
# switch window focus
bind=SUPER,Tab,overcircle,next
bind=ALT,Tab,togglejump
bind=SUPER+shift,n,focusstack,next
bind=SUPER,u,focuslast
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right

# movewin (also floats when you are in normal mode; still invistigating ngl)
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0


# resizewin
bind=CTRL+ALT,k,resizewin,+0,-50
bind=CTRL+ALT,j,resizewin,+0,+50
bind=CTRL+ALT,h,resizewin,-50,+0
bind=CTRL+ALT,l,resizewin,+50,+0

# switch window status (some new bogus stuff in mango; kinda fancy)
# bind=SUPER,g,toggleglobal,
bind=SUPER,space,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
